[package]
name = "temporalshell"
version = "0.1.0"
edition = "2021"
description = "Capability-based Wayland border"
license = "MIT"
repository = "https://github.com/reEnvisioning/temporalShell"

[[bin]]
name = "temporalShell"
path = "src/main.rs"

[[bin]]
name = "temporalshell"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"
